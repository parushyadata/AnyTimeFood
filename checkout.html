<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Dining Out Collections</title>
    
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">zomato</div>
            <input class="location" type="text" value="Ywca, Ashoka Rd, Hanur" readonly>
            <input class="search" type="text" placeholder="Search for restaurant, cuisine or a dish">
            <div class="auth-links">
                <a href="#">Log in</a>
                <a href="#">Sign up</a>
            </div>
        </div>
        <div class="nav-tabs">
            <button class="tab active">Dining Out</button>
            <button class="tab">Delivery</button>
            <button class="tab">Nightlife</button>
        </div>
    </header>
    <main>
        <section class="collections">
            <h2>Collections</h2>
            <p>Explore curated lists of top restaurants, cafes, pubs, and bars in Delhi NCR, based on trends</p>
            <div class="collection-cards">
                <div class="card">
                    <img src="https://via.placeholder.com/200x150" alt="Insta-worthy spots">
                    <div class="card-text">
                        <h3>Insta-worthy spots</h3>
                        <span>38 Places</span>
                    </div>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/200x150" alt="Top trending spots">
                    <div class="card-text">
                        <h3>Top trending spots</h3>
                        <span>29 Places</span>
                    </div>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/200x150" alt="New in town">
                    <div class="card-text">
                        <h3>New in town</h3>
                        <span>13 Places</span>
                    </div>
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/200x150" alt="Omakase bars">
                    <div class="card-text">
                        <h3>Omakase bars</h3>
                        <span>7 Places</span>
                    </div>
                </div>
            </div>
        </section>
        <section class="filters">
            <button>Filters</button>
            <button>Offers</button>
            <button>Rating: 4.5+</button>
            <button>Pet friendly</button>
            <button>Outdoor seating</button>
            <button>Serves Alcohol</button>
            <button>Open Now</button>
        </section>
    </main>
</body>
</html>
